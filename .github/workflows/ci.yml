name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }

env:
  DATABASE_URL: postgres://netfly:netfly@localhost:5432/netfly
  REDIS_URL: redis://localhost:6379/0
  DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
  CONFIG_ENCRYPTION_KEY: Y2ktb25seS1mZXJuZXQta2V5LW5vdC1mb3ItcHJvZC0=

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: netfly, POSTGRES_PASSWORD: netfly, POSTGRES_DB: netfly }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U netfly" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && black --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: python -m pytest -p no:cacheprovider --create-db -W ignore::DeprecationWarning
      - name: OpenAPI schema is current
        run: |
          python manage.py spectacular --format openapi-json --fail-on-warn --file /tmp/openapi.json
          diff -q /tmp/openapi.json ../packages/api-client/openapi.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:generate && git diff --exit-code packages/api-client/src/schema.d.ts
      - run: pnpm -r typecheck
      - run: pnpm --filter @netfly/client lint && pnpm --filter @netfly/admin lint
      - run: pnpm format:check
      - run: pnpm build

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.8, cache: true }
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test integration_test test_driver tool
      - run: flutter analyze --fatal-infos
      - name: Dart API client is current
        run: sh tool/generate_api.sh && git diff --exit-code lib/api/generated
      - run: flutter test
      - run: flutter build apk --release --dart-define=NETFLY_API_URL=https://api.netfly.example
      - uses: actions/upload-artifact@v4
        with: { name: netfly-android-apk, path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk, retention-days: 14 }

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: docker compose up -d --build --wait backend client admin
      - run: pnpm install --frozen-lockfile && pnpm --filter @netfly/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        run: docker compose logs --tail 200
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: e2e/playwright-report, retention-days: 7 }
