[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = ["S101", "S311", "E501", "S603", "S607", "DJ001"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S107"]
"**/migrations/**" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "netfly.settings"
python_files = ["test_*.py"]
addopts = "-q --reuse-db"
