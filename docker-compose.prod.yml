# Production-style stack: `docker compose -f docker-compose.prod.yml up -d`
# Provide the four bootstrap variables via your secret manager / an .env file:
#   DATABASE_URL  REDIS_URL  DJANGO_SECRET_KEY  CONFIG_ENCRYPTION_KEY
# Managed Postgres/Redis are recommended; the bundled ones are for single-host installs.
x-backend: &backend
  build: { context: ./backend, target: prod }
  image: netfly-backend:prod
  environment:
    DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    REDIS_URL: ${REDIS_URL:?set REDIS_URL}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
    CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?set CONFIG_ENCRYPTION_KEY}
  restart: always

services:
  migrate:
    <<: *backend
    restart: "no"
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_config"

  backend:
    <<: *backend
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"], interval: 10s, retries: 6 }

  worker:
    <<: *backend
    command: celery -A netfly worker -Q default -c 4 -l info
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker-transcode:
    <<: *backend
    command: celery -A netfly worker -Q transcode -c 1 -l info --max-tasks-per-child 10
    depends_on: { migrate: { condition: service_completed_successfully } }
    deploy: { replicas: 2 }

  beat:
    <<: *backend
    command: celery -A netfly beat -l info --schedule /tmp/celerybeat-schedule
    depends_on: { migrate: { condition: service_completed_successfully } }
    deploy: { replicas: 1 }   # exactly one scheduler

  client:
    build: { context: ., dockerfile: infra/node.Dockerfile, target: prod, args: { APP: client } }
    image: netfly-client:prod
    environment: { NETFLY_API_URL: http://backend:8000, PORT: "3000" }
    restart: always

  admin:
    build: { context: ., dockerfile: infra/node.Dockerfile, target: prod, args: { APP: admin } }
    image: netfly-admin:prod
    environment: { NETFLY_API_URL: http://backend:8000, PORT: "3001" }
    restart: always

  edge:
    image: nginx:1.27-alpine
    volumes: ["./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["80:80"]
    depends_on: [backend, client, admin]
    restart: always
