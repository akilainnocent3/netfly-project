# Edge proxy for production. TLS terminates here (or at your load balancer).
#   https://netfly.example.com        → client  (viewer app)
#   https://studio.netfly.example.com → admin   (staff app)
#   /api/* on both                     → backend (gunicorn)
# Video bytes never pass through here: browsers fetch segments from S3 / CloudFront.

upstream backend { server backend:8000; keepalive 32; }
upstream client  { server client:3000;  keepalive 32; }
upstream admin   { server admin:3001;   keepalive 16; }

map $http_upgrade $connection_upgrade { default upgrade; "" close; }

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 25m;          # images & subtitles only; video goes straight to S3
  gzip on;
  gzip_types application/json application/vnd.apple.mpegurl text/vtt text/css application/javascript;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";

  # Snippe payment webhooks: public, signature-verified by the API (HMAC of the raw body), retried
  # by Snippe — so no per-IP rate limit here, a small body cap, and the body passed through as is.
  location = /api/v1/payments/webhook/snippe {
    client_max_body_size 64k;
    proxy_request_buffering on;
    proxy_pass http://backend;
    proxy_read_timeout 15s;
  }

  location /api/ {
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://backend;
    proxy_read_timeout 60s;
  }

  location /_next/static/ {
    proxy_pass http://$app_upstream;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Versioned brand files (logos, icons, intro clips): the name changes when the file does.
  location /brand/ {
    proxy_pass http://$app_upstream;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://$app_upstream;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  set $app_upstream client;
  if ($host ~* ^studio\.) { set $app_upstream admin; }
}
