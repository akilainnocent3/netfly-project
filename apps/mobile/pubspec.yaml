name: netfly
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cached_network_image: ^4.0.5
  connectivity_plus: ^7.3.2
  cupertino_icons: ^2.0.0
  cupertino_ui: ^1.1.4
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  google_fonts: ^9.0.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_ui: ^1.8.0
  path_drawing: ^1.0.1
  retrofit: ^4.10.0
  screen_brightness: ^2.1.11
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  video_player: ^2.14.1
  volume_controller: ^3.7.1
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.5
  swagger_parser: ^1.45.0
  retrofit_generator: ^10.3.2
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
  assets:
    - assets/brand/netfly-intro-720p.mp4
    # Inter Tight (the default branding.font_family), bundled so google_fonts needs no download.
    - assets/fonts/

# dart run flutter_launcher_icons — the web's maskable app icon (ribbon-diamond mark on #141414).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app-icon-512.png
  remove_alpha_ios: true
  adaptive_icon_background: "#141414"
  adaptive_icon_foreground: assets/brand/app-icon-512.png

# dart run flutter_native_splash:create — static mark on #141414; the animated reveal follows in Flutter.
flutter_native_splash:
  color: "#141414"
  image: assets/brand/app-icon-512.png
  android_12:
    color: "#141414"
    image: assets/brand/app-icon-512.png
